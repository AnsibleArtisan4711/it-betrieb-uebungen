# Ziel: /etc/ssh/sshd_config.d/10-lab-haertung.conf (Uebung 05.1, Teil 6, Schritt 4).
# Der Dateiname beginnt mit 10-, damit er VOR Dateien wie 50-cloud-init.conf gelesen wird: bei sshd gilt je
# Schluesselwort der ERSTE gefundene Wert (nicht bestaetigt fuer die Hyper-V-Installation; pruefen mit sshd -T).
# NUR aktivieren, nachdem die Schluesselanmeldung in einer ZWEITEN Sitzung funktioniert hat.
PasswordAuthentication no
PermitRootLogin no
